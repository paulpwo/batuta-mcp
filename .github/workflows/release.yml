name: Release

# Releases by itself after CI passes on main: nobody edits a version by hand.
# installer/next-release.mjs reads the Conventional Commit subjects since the last vX.Y.Z tag
# (feat: minor, fix/refactor/chore/...: patch, ! or BREAKING CHANGE: major; docs/test/ci/style
# alone: no release), sets server/package.json, dates the CHANGELOG section, and this job
# commits that as "chore: release X.Y.Z" on main, then creates the tag and the GitHub Release
# with the prebuilt archive, its SHA-256 and install.sh (see docs/06-release.md). A push made
# with GITHUB_TOKEN starts no new workflow run, so the release commit does not loop. Nothing
# is published to npm.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only a green CI run started by a push to main (never a pull request).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit, create the tag and the Release
    steps:
      # actions/checkout v4.4.0 (pinned commit). Full history for the commits since the last tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Decide the next version
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A newer push to main gets its own run; this one only releases the tip it tested.
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "main moved past $SHA; the newer run releases."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)
          range="$last..HEAD"
          [ "$last" = v0.0.0 ] && range=HEAD
          git log -z --format=%B "$range" > "$RUNNER_TEMP/commits"
          node installer/next-release.mjs --root . --last "${last#v}" --commits "$RUNNER_TEMP/commits" \
            --date "$(date -u +%Y-%m-%d)" --notes "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"

      - name: Commit the release on main
        id: commit
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already exists; nothing to do." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json CHANGELOG.md
          git commit -m "chore: release $VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # actions/setup-node v4.4.0 (pinned commit)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22.20.0 # same exact pin as ci.yml

      # The corepack bundled with Node 22 cannot activate pnpm 12, so install the exact version with npm.
      - name: Install pnpm 12.1.0
        if: steps.version.outputs.release == 'true'
        run: |
          npm install --global pnpm@12.1.0
          pnpm --version

      - name: Build the server
        if: steps.version.outputs.release == 'true'
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Pack the release assets
        if: steps.version.outputs.release == 'true'
        run: node installer/pack-release.mjs --out "$RUNNER_TEMP/assets"

      - name: Create the tag and the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          assets="$RUNNER_TEMP/assets"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$assets/batuta-mcp-v$VERSION.tar.gz" \
            "$assets/batuta-mcp-v$VERSION.tar.gz.sha256" \
            "$assets/batuta-mcp.tar.gz" \
            "$assets/batuta-mcp.tar.gz.sha256" \
            "$assets/install.sh"
