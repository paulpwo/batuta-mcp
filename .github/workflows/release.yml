name: Release

# Creates the version tag and the GitHub Release by itself after CI passes on main.
# The version comes from server/package.json; a release happens only when CHANGELOG.md
# has a dated section for that version ("## [X.Y.Z] - YYYY-MM-DD", not "Unreleased")
# and the tag vX.Y.Z does not exist yet. The Release carries the prebuilt archive, its
# SHA-256 and install.sh (see docs/06-release.md). Nothing is published to npm.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only a green CI run started by a push to main (never a pull request).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the Release
    steps:
      # actions/checkout v4.4.0 (pinned commit)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read the version and its CHANGELOG section
        id: version
        run: |
          version=$(node -p "require('./server/package.json').version")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$version' is not X.Y.Z; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          header=$(grep -E "^## \[$version\] - " CHANGELOG.md | head -n 1 || true)
          if ! printf '%s' "$header" | grep -Eq ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "CHANGELOG.md has no dated section for $version; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v head="$header" '$0 == head {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Check the tag is new
        id: fresh
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # actions/setup-node v4.4.0 (pinned commit)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.fresh.outputs.new == 'true'
        with:
          node-version: 22.20.0 # same exact pin as ci.yml

      # The corepack bundled with Node 22 cannot activate pnpm 12, so install the exact version with npm.
      - name: Install pnpm 12.1.0
        if: steps.fresh.outputs.new == 'true'
        run: |
          npm install --global pnpm@12.1.0
          pnpm --version

      - name: Build the server
        if: steps.fresh.outputs.new == 'true'
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Pack the release assets
        if: steps.fresh.outputs.new == 'true'
        run: node installer/pack-release.mjs --out "$RUNNER_TEMP/assets"

      - name: Create the tag and the GitHub Release
        if: steps.fresh.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          assets="$RUNNER_TEMP/assets"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$assets/batuta-mcp-v$VERSION.tar.gz" \
            "$assets/batuta-mcp-v$VERSION.tar.gz.sha256" \
            "$assets/batuta-mcp.tar.gz" \
            "$assets/batuta-mcp.tar.gz.sha256" \
            "$assets/install.sh"
